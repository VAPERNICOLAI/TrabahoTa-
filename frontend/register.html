
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TrabahoTa!</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-container {
            max-width: 480px;
            margin: 65px auto;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .auth-container h2 {
            color: #123b73;
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: 2px solid #2563a6;
            outline-offset: 1px;
        }

        .auth-button {
            width: 100%;
            padding: 13px;
            background: #123b73;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-button:hover {
            background: #09264d;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
        }

        .auth-footer a {
            color: #123b73;
            font-weight: 600;
        }

        #company-group {
            display: none;
        }

        /* SUCCESS AND ERROR MESSAGES */

        .form-message {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 9px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .form-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .form-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        @media (max-width: 520px) {
            .auth-container {
                margin: 25px 15px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <nav>
        <h1>TrabahoTa!</h1>
        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>
</header>

<main>
    <section class="auth-container">

        <h2>Create Your Account</h2>

        <p class="auth-subtitle">
            From Tambay to Trabaho
        </p>

        <form id="register-form">

            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input
                    type="text"
                    id="full_name"
                    required
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" required>
                    <option value="student">Student</option>
                    <option value="company">Company</option>
                </select>
            </div>

            <div class="form-group" id="company-group">
                <label for="company_name">Company Name</label>
                <input
                    type="text"
                    id="company_name"
                >
            </div>

            <button
                type="submit"
                class="auth-button"
                id="submit-button"
            >
                Create Account
            </button>

            <!-- MESSAGE BELOW CREATE ACCOUNT -->
            <div
                id="message"
                class="form-message"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </section>
</main>

<footer>
    <p>TrabahoTa! | SDG 8: Decent Work and Economic Growth</p>
</footer>

<script src="js/register.js"></script>

</body>
</html>
