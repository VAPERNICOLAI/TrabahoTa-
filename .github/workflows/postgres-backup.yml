name: Encrypted PostgreSQL Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install backup utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Create and encrypt database backup
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          PGCONNECT_TIMEOUT: "15"
          PGSSLMODE: require
        run: |
          set -euo pipefail
          umask 077

          test -n "$PROD_DATABASE_URL"
          test -n "$BACKUP_ENCRYPTION_KEY"

          BACKUP_DIR="$(mktemp -d)"
          trap 'rm -rf "$BACKUP_DIR"' EXIT

          BACKUP_NAME="trabahota_prod_$(date -u +%Y%m%d_%H%M%S).dump"

          mkdir -p encrypted-backup

          /usr/lib/postgresql/18/bin/pg_dump \
            --dbname="$PROD_DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="$BACKUP_DIR/$BACKUP_NAME"

          /usr/lib/postgresql/18/bin/pg_restore \
            --file=/dev/null \
            "$BACKUP_DIR/$BACKUP_NAME"

          printf '%s\n' "$BACKUP_ENCRYPTION_KEY" | \
            gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric \
            --cipher-algo AES256 \
            --output "encrypted-backup/$BACKUP_NAME.gpg" \
            "$BACKUP_DIR/$BACKUP_NAME"

          test -s "encrypted-backup/$BACKUP_NAME.gpg"

          echo "SUCCESS: Database backup created and encrypted."

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: trabahota-encrypted-backup
          path: encrypted-backup/*.gpg
          retention-days: 1
          if-no-files-found: error
